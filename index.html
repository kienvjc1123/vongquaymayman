<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ HỆ THỐNG QUAY SỐ GIẢI THƯỞNG ⚡</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 30px; }
        
        /* Khu vực nút chọn giải */
        .prize-selector { margin-bottom: 30px; }
        .prize-btn { 
            background: #333; color: gold; border: 2px solid gold; padding: 10px 20px; 
            margin: 5px; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s;
        }
        .prize-btn.active { background: gold; color: #000; box-shadow: 0 0 15px gold; }

        /* Máy quay số */
        .machine { 
            background: linear-gradient(180deg, #444, #111); border: 8px solid #ffd700; 
            border-radius: 20px; display: inline-block; padding: 40px; 
            box-shadow: 0 0 50px rgba(255,215,0,0.3); 
        }
        .slot { 
            font-size: 100px; background: #000; padding: 20px 40px; border-radius: 10px; 
            color: #00ff00; text-shadow: 0 0 20px #00ff00; font-family: 'Courier New', monospace; 
            letter-spacing: 5px; min-width: 300px;
        }
        
        #prize-title { color: gold; text-transform: uppercase; margin-bottom: 15px; height: 30px; }

        button#spinBtn { 
            background: #ff0000; color: white; border: none; padding: 20px 60px; 
            font-size: 24px; font-weight: bold; border-radius: 50px; cursor: pointer; 
            margin-top: 30px; box-shadow: 0 5px 0 #8b0000; 
        }
        button#spinBtn:disabled { background: #555; box-shadow: none; cursor: not-allowed; }
        button#spinBtn:active { transform: translateY(5px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="prize-selector">
        <button class="prize-btn" onclick="selectPrize(3, this)">GIẢI BA</button>
        <button class="prize-btn" onclick="selectPrize(2, this)">GIẢI NHÌ</button>
        <button class="prize-btn" onclick="selectPrize(1, this)">GIẢI NHẤT</button>
    </div>

    <div class="machine">
        <h2 id="prize-title">Vui lòng chọn giải</h2>
        <div class="slot" id="box">00000</div><br>
        <button id="spinBtn" disabled>QUAY (SPIN)</button>
    </div>

    <script>
        let currentPrize = 0; // 1: Nhất, 2: Nhì, 3: Ba
        const box = document.getElementById('box');
        const spinBtn = document.getElementById('spinBtn');
        const prizeTitle = document.getElementById('prize-title');

        // Hàm chọn giải
        function selectPrize(level, btn) {
            currentPrize = level;
            // Đổi màu nút
            document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Cập nhật tiêu đề và mở nút quay
            prizeTitle.innerText = "ĐANG QUAY: GIẢI " + (level === 1 ? "NHẤT" : (level === 2 ? "NHÌ" : "BA"));
            spinBtn.disabled = false;
            box.style.color = "#00ff00";
            box.innerText = "00000";
        }

        spinBtn.onclick = function() {
            this.disabled = true;
            let count = 0;
            let totalSpins = 60; // Số lần nhảy số
            let speed = 20;      // Tốc độ nhảy cực nhanh
            
            let run = setInterval(() => {
                // Hiệu ứng nhảy số ngẫu nhiên 5 chữ số
                box.innerText = Math.floor(Math.random() * 90000) + 10000;
                count++;
                
                if (count > totalSpins) {
                    clearInterval(run);
                    
                    if (currentPrize === 1) {
                        // NẾU LÀ GIẢI NHẤT: Chỉ ra 1 trong 2 số này
                        const g1 = ["12370", "06370"];
                        box.innerText = g1[Math.floor(Math.random() * g1.length)];
                        box.style.color = "#ffff00"; // Màu vàng cho giải nhất
                    } else {
                        // GIẢI NHÌ & BA: Ra ngẫu nhiên bất kỳ
                        box.innerText = Math.floor(Math.random() * 90000) + 10000;
                        box.style.color = "#00ff00";
                    }
                    
                    this.disabled = false;
                }
            }, speed);
        };
    </script>
</body>
</html>
