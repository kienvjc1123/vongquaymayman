<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vietjet Air - Lucky Roll 2026</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root { --vj-red: #e31a22; --vj-yellow: #ffed00; --vj-dark-red: #b31217; }
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: #f0f2f5; margin: 0; overflow-x: hidden; }
        .vj-slogan-style { font-family: 'Pacifico', cursive !important; color: var(--vj-red); text-shadow: 1px 2px 0px var(--vj-yellow); }
        
        #login-overlay { position: fixed; inset: 0; background: var(--vj-red); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-box { background: white; padding: 30px; border-radius: 30px; width: 90%; max-width: 380px; text-align: center; }
        #main-content { display: none; opacity: 0; transition: 0.5s; }
        .container { max-width: 500px; margin: auto; padding: 20px; text-align: center; }

        .prize-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 20px 0; }
        .prize-btn { padding: 10px 2px; border: 1px solid #ddd; background: #f5f5f5; border-radius: 10px; font-weight: 700; color: #aaa; font-size: 10px; cursor: pointer; transition: 0.2s; }
        .prize-btn.active { background: var(--vj-red) !important; color: white !important; transform: scale(1.05); border-color: var(--vj-red); }
        .prize-btn.finished { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; cursor: not-allowed; opacity: 0.7; }

        .machine-card { background: white; border-radius: 30px; padding: 30px 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .slot-container { display: flex; align-items: center; justify-content: center; background: #E31C2D; border-radius: 20px; height: 110px; position: relative; }
        .vjc-label { color: var(--vj-yellow); font-size: 24px; font-weight: 900; margin-right: 10px; }
        .number-window { height: 80px; display: flex; overflow: hidden; font-family: 'Courier New', monospace; font-size: 50px; color: white; }
        .digit-column { width: 34px; display: flex; flex-direction: column; }
        .digit-column span { height: 80px; display: flex; align-items: center; justify-content: center; }

        #spinBtn { width: 100%; max-width: 220px; padding: 15px; margin-top: 20px; background: var(--vj-red); color: white; border: none; border-radius: 50px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 var(--vj-dark-red); }
        #spinBtn:disabled { background: #ccc !important; box-shadow: none !important; cursor: default; }

        .history-card { background: white; border-radius: 20px; margin-top: 20px; padding: 15px; text-align: left; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 13px; font-weight: 700; }
        
        #rigged-indicator { position: fixed; top: 10px; right: 10px; font-size: 8px; color: transparent; pointer-events: none; }
    </style>
</head>
<body>

    <div id="rigged-indicator">.</div>

    <div id="login-overlay">
        <div class="login-box">
            <h2 class="vj-slogan-style">Vietjet Lucky Roll</h2>
            <input type="password" id="pass" placeholder="Mã kích hoạt" style="width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd; text-align:center">
            <button onclick="login()" style="width:100%; padding:12px; background:var(--vj-red); color:white; border:none; border-radius:10px; font-weight:800">ĐĂNG NHẬP</button>
        </div>
    </div>

    <div id="main-content">
        <header><h1 class="vj-slogan-style" style="font-size: 22px; margin: 10px 0;">Bay là thích ngay!</h1></header>
        <div class="container">
            <div class="prize-selector">
                <button class="prize-btn" id="btn-3" onclick="selectPrize(3)">GIẢI BA (3)</button>
                <button class="prize-btn" id="btn-2" onclick="selectPrize(2)">GIẢI NHÌ (2)</button>
                <button class="prize-btn" id="btn-1" onclick="selectPrize(1)">GIẢI NHẤT (1)</button>
                <button class="prize-btn" id="btn-0" onclick="selectPrize(0)" style="border: 1.5px solid gold; color: #856404;">ĐẶC BIỆT</button>
            </div>

            <div class="machine-card">
                <div id="status" style="color: var(--vj-red); margin-bottom: 10px; font-size: 12px; font-weight: 800; height: 20px; text-transform: uppercase;"></div>
                <div class="slot-container">
                    <div class="vjc-label">VJC</div>
                    <div class="number-window" id="window"></div>
                </div>
                <button id="spinBtn" onclick="spin()" disabled>CHỌN GIẢI ĐỂ QUAY</button>
            </div>

            <div class="history-card">
                <h3 style="color: var(--vj-red); font-size: 12px; margin: 0 0 10px; font-weight: 900;">DANH SÁCH TRÚNG GIẢI:</h3>
                <div id="historyList"></div>
            </div>
            
            <button onclick="openReset()" style="background:none; border:none; color:#ccc; font-size:10px; text-decoration:underline; margin-top:20px; cursor:pointer; width:100%">KHỞI TẠO LẠI DỮ LIỆU</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDIgMehS16uI5ZskLWs1P5tUZT07sf3lEs",
            databaseURL: "https://luckyroll1123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luckyroll1123",
            appId: "1:370017811408:web:0c9794a8c712a1b878d7d5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const fullPool = ["14039", "11389", "12370", "12552", "17817", "17939", "6370", "12190", "14124", "12981", "3638", "4776", "10657", "12980", "8580", "9299", "0227", "14141", "17529", "17963", "2385", "12761", "13352", "12126", "0756", "11064", "11065", "11772", "12379", "12802", "13964", "13992", "14148", "16784", "17824", "18453", "2656", "6316", "6532", "10073", "12380", "11318", "11472", "1803", "15270", "8265", "8746", "9017", "11104", "11207", "11228", "11618", "12278", "6896", "9018", "5849", "9604", "1822", "0060", "7159", "7867", "0908", "11108", "11959", "1419", "2875", "9420"];
        const specialRiggedPool = ["12190", "11389", "12552"];

        let isRiggedMode = false, selectedPrize = null, isSpinning = false;
        let counters = { 3: 0, 2: 0, 1: 0, 0: 0 };
        let historyData = [];

        // Build columns
        const win = document.getElementById('window');
        for(let i=0; i<5; i++) {
            let col = document.createElement('div');
            col.className = 'digit-column';
            for(let j=0; j<60; j++) col.innerHTML += `<span>${j%10}</span>`;
            win.appendChild(col);
        }

        function login() {
            if(document.getElementById('pass').value === "vjc2026") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                setTimeout(() => document.getElementById('main-content').style.opacity = '1', 50);
            } else alert("Sai mã!");
        }

        db.ref('luckyroll_vjc_v3').on('value', snap => {
            const data = snap.val() || {};
            historyData = data.history || [];
            counters = data.counters || { 3: 0, 2: 0, 1: 0, 0: 0 };
            updateUI();
        });

        function selectPrize(lv) {
            if(isSpinning) return;
            const limits = { 3: 3, 2: 2, 1: 1, 0: 1 };
            if(counters[lv] >= limits[lv]) return;
            
            selectedPrize = lv;
            document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lv).classList.add('active');
            
            const names = { 3: "Giải Ba", 2: "Giải Nhì", 1: "Giải Nhất", 0: "Giải Đặc Biệt" };
            document.getElementById('status').innerText = "Sẵn sàng quay " + names[lv];
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('spinBtn').innerText = "QUAY NGAY";
        }

        function updateUI() {
            const limits = { 3: 3, 2: 2, 1: 1, 0: 1 };
            [0, 1, 2, 3].forEach(lv => {
                const btn = document.getElementById('btn-' + lv);
                btn.classList.toggle('finished', counters[lv] >= limits[lv]);
            });

            document.getElementById('historyList').innerHTML = historyData.map(h => 
                `<div class="history-item"><span>VJC ${h.code}</span><span style="color:var(--vj-red)">${h.name}</span></div>`
            ).join('');
        }

        function spin() {
            if(isSpinning || selectedPrize === null) return;
            
            // LỌC DANH SÁCH: Loại bỏ những người đã trúng giải
            const wonCodes = historyData.map(h => h.code);
            const availablePool = fullPool.filter(code => !wonCodes.includes(code));

            if(availablePool.length === 0) {
                alert("Đã hết người tham gia trong danh sách!");
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            const cols = document.querySelectorAll('.digit-column');
            cols.forEach(c => { c.style.transition = 'none'; c.style.transform = 'translateY(0)'; });

            setTimeout(() => {
                let result;

                // LOGIC QUAY SỐ
                if (selectedPrize === 0 && isRiggedMode) {
                    // Dàn xếp Đặc biệt: Chọn 1 trong 3 mã yêu cầu (nếu mã đó chưa trúng)
                    const availableRigged = specialRiggedPool.filter(c => !wonCodes.includes(c));
                    if(availableRigged.length > 0) {
                        result = availableRigged[Math.floor(Math.random() * availableRigged.length)];
                    } else {
                        result = availablePool[Math.floor(Math.random() * availablePool.length)];
                    }
                } else {
                    // Chế độ thường hoặc các giải Ba, Nhì, Nhất: Random 100%
                    result = availablePool[Math.floor(Math.random() * availablePool.length)];
                }

                const finalCode = result.padStart(5, '0');
                cols.forEach((c, i) => {
                    const dist = (parseInt(finalCode[i]) + 40) * 80;
                    c.style.transition = `transform ${2.5 + i * 0.4}s cubic-bezier(0.1, 0, 0.1, 1)`;
                    c.style.transform = `translateY(-${dist}px)`;
                });

                setTimeout(() => {
                    confetti({ particleCount: 150, spread: 70, colors: ['#e31a22', '#ffed00'] });
                    const names = { 3: "Giải Ba", 2: "Giải Nhì", 1: "Giải Nhất", 0: "Giải Đặc Biệt" };
                    
                    historyData.unshift({ code: result, name: names[selectedPrize] });
                    counters[selectedPrize]++;
                    
                    db.ref('luckyroll_vjc_v3').update({ history: historyData, counters: counters });
                    
                    isSpinning = false;
                    selectedPrize = null;
                    document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
                    document.getElementById('status').innerText = "CHÚC MỪNG VJC " + result + "!";
                    document.getElementById('spinBtn').innerText = "CHỌN GIẢI TIẾP THEO";
                }, 5000);
            }, 50);
        }

        function openReset() {
            if(confirm("Xác nhận xóa lịch sử trúng giải và khởi tạo lại?")) {
                const p = prompt("Nhập mật khẩu xác nhận:");
                if(p === "vjc2026") {
                    db.ref('luckyroll_vjc_v3').remove().then(() => location.reload());
                } else alert("Sai mật khẩu!");
            }
        }

        // Bật/Tắt mode dàn xếp Đặc Biệt bằng phím Ctrl
        window.addEventListener('keydown', e => { 
            if (e.key === "Control") { 
                isRiggedMode = !isRiggedMode; 
                document.getElementById('rigged-indicator').style.color = isRiggedMode ? "#eee" : "transparent";
                console.log("Rigged Mode: " + isRiggedMode);
            } 
        });
    </script>
</body>
</html>
