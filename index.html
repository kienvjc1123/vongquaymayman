<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vietjet Air - Bay là thích ngay!</title>
    
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3233/3233895.png" type="image/png">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Pacifico&display=swap');
        :root { --vj-red: #e31a22; --vj-yellow: #ffed00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f2f5; margin: 0; font-family: 'Montserrat', sans-serif; min-height: 100vh; padding-bottom: 50px; user-select: none; overflow-x: hidden; }

        #login-overlay { position: fixed; inset: 0; background: var(--vj-red); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .login-box h2 { font-family: 'Pacifico', cursive; color: var(--vj-red); margin: 0 0 20px; font-size: 28px; }
        .login-box input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; margin-bottom: 20px; outline: none; font-size: 16px; }
        .login-box button { width: 100%; padding: 15px; background: var(--vj-red); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }

        #main-content { display: none; }
        header { background: white; padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .slogan { font-family: 'Pacifico', cursive; color: var(--vj-red); font-size: 32px; text-shadow: 2px 2px 0px rgba(255, 237, 0, 0.8); margin: 0; }

        .container { max-width: 500px; margin: auto; padding: 20px; text-align: center; }
        .prize-selector { display: flex; gap: 10px; margin: 20px 0; }
        .prize-btn { flex: 1; padding: 12px 5px; border: 1px solid #eee; background: white; border-radius: 12px; font-weight: 900; color: #666; cursor: pointer; transition: 0.2s; font-size: 11px; outline: none; }
        .prize-btn.active { background: var(--vj-red); color: white; border-color: var(--vj-red); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(227,26,34,0.2); }
        .prize-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #eee; color: #aaa; border-color: #ddd; }

        .machine-card { background: white; border-radius: 30px; padding: 40px 15px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); position: relative; }
        .slot-container { display: flex; align-items: center; justify-content: center; background: #1a1a1a; padding: 30px 10px; border-radius: 20px; box-shadow: inset 0 0 30px #000; overflow: hidden; }
        .vjc-text { color: var(--vj-yellow); font-size: clamp(28px, 8vw, 42px); font-weight: 900; margin-right: 12px; }
        
        .number-window { height: 80px; display: flex; overflow: hidden; font-family: 'Courier New', monospace; font-size: clamp(45px, 12vw, 65px); color: white; line-height: 80px; }
        .digit-column { width: clamp(35px, 9vw, 50px); display: flex; flex-direction: column; text-align: center; transform: translateY(0); }
        .digit-column span { height: 80px; min-height: 80px; display: flex; align-items: center; justify-content: center; }

        #spinBtn { width: 100%; max-width: 280px; padding: 20px; margin-top: 30px; background: linear-gradient(to bottom, #ff4d4d, var(--vj-red)); color: white; border: none; border-radius: 50px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 #b31217; outline: none; }
        #spinBtn:active { transform: translateY(4px); box-shadow: 0 4px 0 #b31217; }
        #spinBtn:disabled { background: #ccc; box-shadow: none; transform: translateY(4px); }

        .history-card { background: white; border-radius: 20px; margin-top: 30px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: left; }
        .history-card h3 { color: var(--vj-red); font-size: 16px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; margin-top: 0; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-weight: bold; }
        .history-item span:first-child { color: var(--vj-red); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="login-overlay">
        <div class="login-box">
            <h2>Bay là thích ngay!</h2>
            <input type="password" id="pass" placeholder="Mật khẩu hệ thống..." autofocus>
            <button onclick="login()">ĐĂNG NHẬP</button>
        </div>
    </div>

    <div id="main-content">
        <header><h1 class="slogan">Bay là thích ngay!</h1></header>
        <div class="container">
            <div class="prize-selector">
                <button class="prize-btn" id="btn-3" onclick="setPrize(3, this)">GIẢI BA</button>
                <button class="prize-btn" id="btn-2" onclick="setPrize(2, this)">GIẢI NHÌ</button>
                <button class="prize-btn" id="btn-1" onclick="setPrize(1, this)">GIẢI NHẤT</button>
            </div>

            <div class="machine-card">
                <div id="status" style="color: var(--vj-red); margin-bottom: 15px; font-size: 15px; font-weight: 900; height: 20px; text-transform: uppercase;"></div>
                <div class="slot-container">
                    <div class="vjc-text">VJC</div>
                    <div class="number-window" id="window">
                        <div class="digit-column"></div>
                        <div class="digit-column"></div>
                        <div class="digit-column"></div>
                        <div class="digit-column"></div>
                        <div class="digit-column"></div>
                    </div>
                </div>
                <button id="spinBtn" onclick="spin()">QUAY NGAY</button>
            </div>

            <div class="history-card">
                <h3>DANH SÁCH TRÚNG THƯỞNG:</h3>
                <ul class="history-list" id="historyList"></ul>
            </div>
            
            <p id="footer-text" style="margin-top: 30px; font-size: 11px; color: #bbb;">© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ</p>
        </div>
    </div>

    <script>
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false;
        };

        let isRandomMode = false;
        let currentPrize = 0;
        let currentBtn = null;
        const columns = document.querySelectorAll('.digit-column');

        columns.forEach(col => {
            let content = '';
            for(let i=0; i<60; i++) content += `<span>${i % 10}</span>`;
            col.innerHTML = content;
        });

        window.addEventListener('keydown', function(e) {
            if (e.key === "Control") {
                isRandomMode = !isRandomMode;
                document.getElementById('footer-text').innerText = "© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ" + (isRandomMode ? "." : "");
            }
        });

        function login() {
            if (document.getElementById('pass').value === "vjc2026") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

        function setPrize(lv, btn) {
            if(btn.classList.contains('active')) {
                currentPrize = 0;
                btn.classList.remove('active');
                document.getElementById('status').innerText = "";
            } else {
                currentPrize = lv;
                currentBtn = btn;
                document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('status').innerText = "ĐANG QUAY GIẢI " + (lv==1?'NHẤT':lv==2?'NHÌ':'BA');
            }
        }

        function spin() {
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;

            // BƯỚC QUAN TRỌNG: Đưa tất cả cột về vị trí 0 ngay lập tức trước khi chạy hiệu ứng mới
            columns.forEach(col => {
                col.style.transition = 'none';
                col.style.transform = 'translateY(0)';
            });

            // Ép trình duyệt nhận diện việc reset trước khi chạy hiệu ứng cuộn (dùng requestAnimationFrame)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    let result = "";
                    const targets = ["06370", "12370", "17939"];
                    
                    if (isRandomMode || currentPrize === 0) {
                        result = Math.floor(Math.random() * 90000 + 10000).toString();
                    } else {
                        result = targets[currentPrize - 1];
                    }

                    columns.forEach((col, idx) => {
                        const targetDigit = parseInt(result[idx]);
                        // Tăng số vòng cuộn lên 40 để nhìn xoay nhanh và lâu hơn
                        const move = (targetDigit + 40) * 80; 
                        col.style.transition = `transform ${2.5 + idx*0.3}s cubic-bezier(0.1, 0, 0.1, 1)`;
                        col.style.transform = `translateY(-${move}px)`;
                    });

                    setTimeout(() => {
                        if (currentPrize !== 0) {
                            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#e31a22', '#ffed00'] });
                            const list = document.getElementById('historyList');
                            const li = document.createElement('li');
                            li.className = 'history-item';
                            const pName = currentPrize==1?'Giải Nhất':currentPrize==2?'Giải Nhì':'Giải Ba';
                            li.innerHTML = `<span>VJC ${result}</span> <span>${pName}</span>`;
                            list.prepend(li);

                            currentBtn.disabled = true;
                            currentBtn.classList.remove('active');
                            document.getElementById('status').innerText = "ĐÃ XONG " + pName.toUpperCase();
                            currentPrize = 0;
                        }
                        btn.disabled = false;
                    }, 4500);
                });
            });
        }
    </script>
</body>
</html>
