<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vietjet Air - Lucky Roll 2026</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root { --vj-red: #e31a22; --vj-yellow: #ffed00; --vj-dark-red: #b31217; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Montserrat', sans-serif; }
        body { background: #f0f2f5; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .vj-slogan-style { font-family: 'Pacifico', cursive !important; color: var(--vj-red); text-shadow: 1px 2px 0px var(--vj-yellow); font-weight: 400; }

        /* Plane Layer */
        #plane-layer { position: fixed; inset: 0; z-index: 2500; pointer-events: none; display: none; background: white; }
        .vj-plane-img { position: absolute; top: 50%; left: -400px; width: 280px; transform: translateY(-50%); transition: left 1.2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Login */
        #login-overlay { position: fixed; inset: 0; background: var(--vj-red); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-box { background: white; padding: 35px 30px; border-radius: 30px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .login-logo { width: 140px; margin-bottom: 10px; }
        .login-box input { width: 100%; padding: 16px; border: 2px solid #f0f0f0; border-radius: 15px; margin-bottom: 20px; text-align: center; font-size: 16px; font-weight: 600; outline: none; }
        .login-box button { width: 100%; padding: 16px; background: var(--vj-red); color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; font-size: 16px; box-shadow: 0 4px 0 var(--vj-dark-red); }

        /* Reset Modal */
        #reset-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 340px; text-align: center; }

        /* Main UI */
        #main-content { display: none; opacity: 0; transition: 0.5s; }
        header { background: white; padding: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .container { max-width: 500px; margin: auto; padding: 20px; text-align: center; }

        .prize-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 20px 0; }
        .prize-btn { padding: 12px 2px; border: 1px solid #ddd; background: #f5f5f5; border-radius: 12px; font-weight: 700; color: #aaa; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .prize-btn.active { background: var(--vj-red) !important; color: white !important; transform: scale(1.05); border: 1.5px solid var(--vj-red); }
        .prize-btn.finished { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #a5d6a7; cursor: not-allowed; opacity: 0.8; }
        #btn-0 { border: 1.5px solid gold; }

        .machine-card { background: white; border-radius: 30px; padding: 35px 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .slot-container { display: flex; align-items: center; justify-content: center; background: #E31C2D; border-radius: 20px; height: 120px; }
        .vjc-label { color: var(--vj-yellow); font-size: 24px; font-weight: 900; margin-right: 10px; }
        .number-window { height: 80px; display: flex; overflow: hidden; font-family: 'Courier New', monospace !important; font-size: 50px; color: white; line-height: 80px; }
        .digit-column { width: 38px; display: flex; flex-direction: column; text-align: center; }
        .digit-column span { height: 80px; display: flex; align-items: center; justify-content: center; }

        #spinBtn { width: 100%; max-width: 240px; padding: 16px; margin-top: 25px; background: var(--vj-red); color: white; border: none; border-radius: 50px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 var(--vj-dark-red); }
        #spinBtn:disabled { background: #ccc !important; box-shadow: none !important; color: #999; transform: translateY(3px); }

        .history-card { background: white; border-radius: 20px; margin-top: 25px; padding: 20px; text-align: left; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-weight: 700; font-size: 14px; }
        .btn-reset-link { background: none; border: none; color: #ccc; font-size: 10px; text-decoration: underline; cursor: pointer; margin-top: 30px; display: block; width: 100%; }
        #footer-text { font-size: 9px; color: #ddd; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="plane-layer"><img src="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png" class="vj-plane-img" id="plane-asset"></div>

    <div id="reset-modal">
        <div class="modal-box">
            <h3 style="font-size: 16px; margin-top:0">Xác nhận khởi tạo lại dữ liệu</h3>
            <input type="password" id="reset-pass" placeholder="Mã bảo mật" style="width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 10px; text-align: center;">
            <div style="display: flex; gap: 10px;">
                <button onclick="closeResetModal()" style="flex:1; padding:10px; border:none; border-radius:10px; background:#eee">HỦY</button>
                <button onclick="executeReset()" style="flex:1; padding:10px; border:none; border-radius:10px; background:var(--vj-red); color:white">XÁC NHẬN</button>
            </div>
        </div>
    </div>

    <div id="login-overlay">
        <div class="login-box">
            <img src="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png" class="login-logo">
            <h2 class="vj-slogan-style">Bay là thích ngay!</h2>
            <input type="password" id="pass" placeholder="Mã kích hoạt hệ thống" autofocus>
            <button onclick="login()">ĐĂNG NHẬP</button>
        </div>
    </div>

    <div id="main-content">
        <header><h1 class="vj-slogan-style" style="font-size: 24px; margin: 0;">Bay là thích ngay!</h1></header>
        <div class="container">
            <div class="prize-selector">
                <button class="prize-btn" id="btn-3" onclick="selectPrize(3)">GIẢI BA (3)</button>
                <button class="prize-btn" id="btn-2" onclick="selectPrize(2)">GIẢI NHÌ (2)</button>
                <button class="prize-btn" id="btn-1" onclick="selectPrize(1)">GIẢI NHẤT (1)</button>
                <button class="prize-btn" id="btn-0" onclick="selectPrize(0)">ĐẶC BIỆT</button>
            </div>
            <div class="machine-card">
                <div id="status" style="color: var(--vj-red); margin-bottom: 10px; font-size: 13px; font-weight: 800; height: 20px; text-transform: uppercase;"></div>
                <div class="slot-container">
                    <div class="vjc-label">VJC</div>
                    <div class="number-window" id="window"></div>
                </div>
                <button id="spinBtn" onclick="spin()">QUAY NGAY</button>
            </div>
            <div class="history-card">
                <h3 style="color: var(--vj-red); font-size: 12px; margin: 0 0 10px; font-weight: 900;">DANH SÁCH TRÚNG THƯỞNG:</h3>
                <div id="historyList"></div>
            </div>
            <button class="btn-reset-link" onclick="openResetModal()">KHỞI TẠO LẠI DỮ LIỆU</button>
            <div id="footer-text">© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDIgMehS16uI5ZskLWs1P5tUZT07sf3lEs",
            databaseURL: "https://luckyroll1123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luckyroll1123",
            appId: "1:370017811408:web:0c9794a8c712a1b878d7d5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const fullPool = ["14039", "11389", "12370", "12552", "17817", "17939", "6370", "12190", "14124", "12981", "3638", "4776", "10657", "12980", "8580", "9299", "0227", "14141", "17529", "17963", "2385", "12761", "13352", "12126", "0756", "11064", "11065", "11772", "12379", "12802", "13964", "13992", "14148", "16784", "17824", "18453", "2656", "6316", "6532", "10073", "12380", "11318", "11472", "1803", "15270", "8265", "8746", "9017", "11104", "11207", "11228", "11618", "12278", "6896", "9018", "5849", "9604", "1822", "0060", "7159", "7867", "0908", "11108", "11959", "1419", "2875", "9420"];
        const specialRiggedPool = ["12190", "11389", "12552"];

        let isRigged = false, selectedPrize = null, isSpinning = false;
        let counters = { 3: 0, 2: 0, 1: 0, 0: 0 };
        let historyData = [];

        // Build columns
        const win = document.getElementById('window');
        for(let i=0; i<5; i++) {
            let col = document.createElement('div');
            col.className = 'digit-column';
            for(let j=0; j<60; j++) col.innerHTML += `<span>${j%10}</span>`;
            win.appendChild(col);
        }

        function login() {
            if (document.getElementById('pass').value === "vjc2026") {
                const planeLayer = document.getElementById('plane-layer');
                const planeImg = document.getElementById('plane-asset');
                planeLayer.style.display = 'block';
                setTimeout(() => {
                    planeImg.style.left = '120%';
                    setTimeout(() => {
                        document.getElementById('login-overlay').style.display = 'none';
                        planeLayer.style.display = 'none';
                        document.getElementById('main-content').style.display = 'block';
                        setTimeout(() => { document.getElementById('main-content').style.opacity = '1'; }, 50);
                    }, 900);
                }, 100);
            } else { alert("Sai mã!"); }
        }

        db.ref('luckyroll_final_v3').on('value', snap => {
            const data = snap.val() || {};
            historyData = data.history || [];
            counters = data.counters || { 3: 0, 2: 0, 1: 0, 0: 0 };
            updateUI();
        });

        function selectPrize(lv) {
            if (isSpinning) return;
            const limits = { 3: 3, 2: 2, 1: 1, 0: 1 };
            if (counters[lv] >= limits[lv]) return;
            
            selectedPrize = lv;
            document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lv).classList.add('active');
            
            const names = { 3: "GIẢI BA", 2: "GIẢI NHÌ", 1: "GIẢI NHẤT", 0: "GIẢI ĐẶC BIỆT" };
            document.getElementById('status').innerText = "SẴN SÀNG QUAY " + names[lv];
        }

        function updateUI() {
            const limits = { 3: 3, 2: 2, 1: 1, 0: 1 };
            [0, 1, 2, 3].forEach(lv => {
                const btn = document.getElementById('btn-' + lv);
                btn.classList.toggle('finished', counters[lv] >= limits[lv]);
            });

            document.getElementById('historyList').innerHTML = historyData.map(h => 
                `<div class="history-item"><span style="color:var(--vj-red)">VJC ${h.code}</span> <span>${h.name}</span></div>`
            ).join('');
            
            document.getElementById('footer-text').innerText = "© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ" + (isRigged ? "." : "");
        }

        function spin() {
            if (isSpinning || selectedPrize === null) return;
            
            const wonCodes = historyData.map(h => h.code);
            const availablePool = fullPool.filter(code => !wonCodes.includes(code));

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('status').innerText = "ĐANG QUAY...";
            
            const cols = document.querySelectorAll('.digit-column');
            cols.forEach(c => { c.style.transition = 'none'; c.style.transform = 'translateY(0)'; });

            setTimeout(() => {
                let result;
                if (selectedPrize === 0 && isRigged) {
                    const availRigged = specialRiggedPool.filter(c => !wonCodes.includes(c));
                    result = availRigged.length > 0 ? availRigged[Math.floor(Math.random() * availRigged.length)] : availablePool[Math.floor(Math.random() * availablePool.length)];
                } else {
                    result = availablePool[Math.floor(Math.random() * availablePool.length)];
                }

                const finalCode = result.padStart(5, '0');
                cols.forEach((c, i) => {
                    const dist = (parseInt(finalCode[i]) + 40) * 80;
                    c.style.transition = `transform ${2.5 + i * 0.3}s cubic-bezier(0.1, 0, 0.1, 1)`;
                    c.style.transform = `translateY(-${dist}px)`;
                });

                setTimeout(() => {
                    confetti({ particleCount: 150, spread: 70, colors: ['#e31a22', '#ffed00'] });
                    const names = { 3: "Giải Ba", 2: "Giải Nhì", 1: "Giải Nhất", 0: "Giải Đặc Biệt" };
                    
                    historyData.unshift({ code: result, name: names[selectedPrize] });
                    counters[selectedPrize]++;
                    
                    db.ref('luckyroll_final_v3').update({ history: historyData, counters: counters });
                    
                    isSpinning = false;
                    const lastWinner = names[selectedPrize].toUpperCase();
                    selectedPrize = null;
                    document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
                    document.getElementById('status').innerText = "CHÚC MỪNG " + lastWinner + "!";
                    document.getElementById('spinBtn').disabled = false;
                }, 4500);
            }, 50);
        }

        function openResetModal() { document.getElementById('reset-modal').style.display = 'flex'; }
        function closeResetModal() { document.getElementById('reset-modal').style.display = 'none'; }
        function executeReset() {
            if (document.getElementById('reset-pass').value === "vjc2026") {
                db.ref('luckyroll_final_v3').remove().then(() => location.reload());
            } else alert("Sai mã!");
        }

        window.addEventListener('keydown', e => { 
            if (e.key === "Control") { isRigged = !isRigged; updateUI(); } 
        });
    </script>
</body>
</html>
