<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vietjet Air - Bay là thích ngay!</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3233/3233895.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Pacifico&display=swap');
        :root { --vj-red: #e31a22; --vj-yellow: #ffed00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f2f5; margin: 0; font-family: 'Montserrat', sans-serif; min-height: 100vh; padding-bottom: 50px; user-select: none; overflow-x: hidden; }

        #login-overlay { position: fixed; inset: 0; background: var(--vj-red); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .login-box h2 { font-family: 'Pacifico', cursive; color: var(--vj-red); margin: 0 0 20px; font-size: 28px; }
        .login-box input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; margin-bottom: 20px; outline: none; font-size: 16px; }
        .login-box button { width: 100%; padding: 15px; background: var(--vj-red); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }

        #main-content { display: none; }
        header { background: white; padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .slogan { font-family: 'Pacifico', cursive; color: var(--vj-red); font-size: 32px; text-shadow: 2px 2px 0px rgba(255, 237, 0, 0.8); margin: 0; }

        .container { max-width: 500px; margin: auto; padding: 20px; text-align: center; }
        .prize-selector { display: flex; gap: 10px; margin: 20px 0; }
        .prize-btn { flex: 1; padding: 12px 5px; border: 1px solid #eee; background: white; border-radius: 12px; font-weight: 900; color: #666; cursor: pointer; transition: 0.2s; font-size: 11px; outline: none; }
        .prize-btn.active { background: var(--vj-red); color: white; border-color: var(--vj-red); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(227,26,34,0.2); }
        .prize-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

        /* Fix cứng giao diện Laptop */
        .slot-container { display: flex; align-items: center; justify-content: center; background: #1a1a1a; padding: 20px 10px; border-radius: 20px; box-shadow: inset 0 0 30px #000; overflow: hidden; height: 140px !important; }
        .vjc-text { color: var(--vj-yellow); font-size: clamp(28px, 8vw, 42px); font-weight: 900; margin-right: 12px; }
        
        .number-window { height: 90px !important; display: flex; overflow: hidden; font-family: 'Courier New', monospace; font-size: clamp(45px, 12vw, 65px); color: white; line-height: 90px !important; }
        .digit-column { width: clamp(35px, 9vw, 50px); display: flex; flex-direction: column; text-align: center; }
        .digit-column span { height: 90px !important; min-height: 90px !important; display: flex; align-items: center; justify-content: center; }

        #spinBtn { width: 100%; max-width: 280px; padding: 20px; margin-top: 30px; background: linear-gradient(to bottom, #ff4d4d, var(--vj-red)); color: white; border: none; border-radius: 50px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 #b31217; outline: none; }
        #spinBtn:disabled { background: #ccc; box-shadow: none; transform: translateY(4px); opacity: 0.7; }

        .history-card { background: white; border-radius: 20px; margin-top: 30px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: left; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-weight: bold; }
        .history-item span:first-child { color: var(--vj-red); }

        .reset-section { margin-top: 40px; opacity: 0.3; }
        .reset-btn { background: none; border: 1px solid #ccc; padding: 5px 15px; border-radius: 10px; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>Bay là thích ngay!</h2>
            <input type="password" id="pass" placeholder="Mật khẩu..." autofocus>
            <button onclick="login()">ĐĂNG NHẬP</button>
        </div>
    </div>

    <div id="main-content">
        <header><h1 class="slogan">Bay là thích ngay!</h1></header>
        <div class="container">
            <div class="prize-selector" id="pSelector">
                <button class="prize-btn" id="btn-3" onclick="setPrize(3, this)">GIẢI BA</button>
                <button class="prize-btn" id="btn-2" onclick="setPrize(2, this)" disabled>GIẢI NHÌ</button>
                <button class="prize-btn" id="btn-1" onclick="setPrize(1, this)" disabled>GIẢI NHẤT</button>
            </div>

            <div class="machine-card">
                <div id="status" style="color: var(--vj-red); margin-bottom: 15px; font-size: 14px; font-weight: 900; height: 20px; text-transform: uppercase;"></div>
                <div class="slot-container">
                    <div class="vjc-text">VJC</div>
                    <div class="number-window">
                        <div class="digit-column"></div><div class="digit-column"></div><div class="digit-column"></div><div class="digit-column"></div><div class="digit-column"></div>
                    </div>
                </div>
                <button id="spinBtn" onclick="spin()">QUAY NGAY</button>
            </div>

            <div class="history-card">
                <h3 style="color: var(--vj-red); font-size: 14px; margin-top: 0;">DANH SÁCH TRÚNG THƯỞNG:</h3>
                <ul class="history-list" id="historyList"></ul>
            </div>

            <div class="reset-section">
                <button class="reset-btn" onclick="resetSystem()">RESET DATA</button>
            </div>
            <p id="footer-text" style="margin-top: 20px; font-size: 10px; color: #bbb;">© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ</p>
        </div>
    </div>

    <script>
        // Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDIgMehS16uI5ZskLWs1P5tUZT07sf3lEs",
            authDomain: "luckyroll1123.firebaseapp.com",
            databaseURL: "https://luckyroll1123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luckyroll1123",
            storageBucket: "luckyroll1123.firebasestorage.app",
            messagingSenderId: "370017811408",
            appId: "1:370017811408:web:0c9794a8c712a1b878d7d5",
            measurementId: "G-5RXY2JEVY5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isRigged = false; 
        let currentPrize = 0;
        let finishedPrizes = [];
        let historyData = [];

        // Lắng nghe dữ liệu realtime từ server
        db.ref('luckyroll_vjc').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                finishedPrizes = data.finishedPrizes || [];
                historyData = data.historyData || [];
                renderHistory();
                updateButtons();
            } else {
                finishedPrizes = [];
                historyData = [];
                renderHistory();
                updateButtons();
            }
        });

        const columns = document.querySelectorAll('.digit-column');
        columns.forEach(col => {
            let content = '';
            for(let i=0; i<60; i++) content += `<span>${i % 10}</span>`;
            col.innerHTML = content;
        });

        window.addEventListener('keydown', function(e) {
            if (e.key === "Control") {
                isRigged = !isRigged;
                document.getElementById('footer-text').innerText = "© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ" + (isRigged ? "." : "");
            }
        });

        function login() {
            if (document.getElementById('pass').value === "vjc2026") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

        function setPrize(lv, btn) {
            if (finishedPrizes.includes(lv)) return;
            currentPrize = lv;
            document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('status').innerText = "ĐANG QUAY GIẢI " + (lv==1?'NHẤT':lv==2?'NHÌ':'BA');
        }

        function updateButtons() {
            const spinBtn = document.getElementById('spinBtn');
            const b1 = document.getElementById('btn-1');
            const b2 = document.getElementById('btn-2');
            const b3 = document.getElementById('btn-3');

            b3.disabled = finishedPrizes.includes(3);
            b2.disabled = !finishedPrizes.includes(3) || finishedPrizes.includes(2);
            b1.disabled = !finishedPrizes.includes(2) || finishedPrizes.includes(1);

            if (finishedPrizes.includes(1)) {
                spinBtn.disabled = true;
                spinBtn.innerText = "KẾT THÚC";
                document.getElementById('status').innerText = "HOÀN THÀNH";
            } else {
                spinBtn.disabled = false;
                spinBtn.innerText = "QUAY NGAY";
            }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = historyData.map(item => 
                `<li class="history-item"><span>VJC ${item.code}</span> <span>${item.name}</span></li>`
            ).join('');
        }

        function spin() {
            const spinBtn = document.getElementById('spinBtn');
            const activePrize = currentPrize;
            if (activePrize === 0 && isRigged) {
                alert("Vui lòng chọn giải trước khi quay dàn xếp!");
                return;
            }
            
            spinBtn.disabled = true;
            document.querySelectorAll('.prize-btn').forEach(b => b.disabled = true);

            columns.forEach(col => { col.style.transition = 'none'; col.style.transform = 'translateY(0)'; });

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    let result = "";
                    const targets = ["06370", "12370", "17939"];
                    
                    if (!isRigged || activePrize === 0) {
                        result = Math.floor(Math.random() * 90000 + 10000).toString();
                    } else {
                        result = targets[activePrize - 1];
                    }

                    columns.forEach((col, idx) => {
                        const targetDigit = parseInt(result[idx]);
                        const move = (targetDigit + 40) * 90; 
                        col.style.transition = `transform ${2.5 + idx*0.3}s cubic-bezier(0.1, 0, 0.1, 1)`;
                        col.style.transform = `translateY(-${move}px)`;
                    });

                    setTimeout(() => {
                        // Chỉ lưu và bắn pháo hoa nếu là DÀN XẾP và CÓ CHỌN GIẢI
                        if (isRigged && activePrize !== 0) {
                            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#e31a22', '#ffed00'] });
                            const pName = activePrize==1?'Giải Nhất':activePrize==2?'Giải Nhì':'Giải Ba';
                            
                            historyData.unshift({ code: result, name: pName });
                            finishedPrizes.push(activePrize);
                            
                            // Gửi lên Firebase
                            db.ref('luckyroll_vjc').set({
                                historyData: historyData,
                                finishedPrizes: finishedPrizes
                            });
                            currentPrize = 0;
                        } else {
                            // Quay diễn thì chỉ mở lại nút
                            updateButtons();
                            document.getElementById('status').innerText = "CHỌN GIẢI KẾ TIẾP";
                        }
                    }, 4500);
                });
            });
        }

        function resetSystem() {
            if (confirm("Xác nhận RESET toàn bộ hệ thống?")) {
                const p = prompt("Mật khẩu:");
                if (p === "vjc2026") {
                    db.ref('luckyroll_vjc').remove().then(() => {
                        alert("Đã xóa dữ liệu trên mây!");
                        location.reload();
                    });
                }
            }
        }
    </script>
</body>
</html>
