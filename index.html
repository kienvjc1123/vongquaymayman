<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vietjet Air - Lucky Roll 2026</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        :root { --vj-red: #e31a22; --vj-yellow: #ffed00; }
        body { background: #f0f2f5; font-family: 'Montserrat', sans-serif; margin: 0; text-align: center; }
        .vj-slogan { font-family: 'Pacifico', cursive; color: var(--vj-red); text-shadow: 1px 2px 0 var(--vj-yellow); }
        
        #login-overlay { position: fixed; inset: 0; background: var(--vj-red); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-box { background: white; padding: 40px; border-radius: 30px; width: 350px; }
        
        .container { max-width: 600px; margin: auto; padding: 20px; }
        .slot-machine { background: #1a1a1a; padding: 40px 20px; border-radius: 30px; border: 8px solid #333; box-shadow: inset 0 0 30px #000; margin: 20px 0; position: relative; }
        
        .slot-machine::before, .slot-machine::after { content: ""; position: absolute; left: 0; right: 0; height: 40px; z-index: 5; pointer-events: none; }
        .slot-machine::before { top: 80px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
        .slot-machine::after { bottom: 40px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }

        .slot-container { display: flex; align-items: center; justify-content: center; position: relative; z-index: 2; }
        .vjc-label { color: var(--vj-yellow); font-size: 38px; font-weight: 900; margin-right: 20px; letter-spacing: 2px; }
        .number-window { height: 100px; display: flex; overflow: hidden; background: #222; border-radius: 10px; padding: 0 10px; }
        .digit-column { width: 50px; display: flex; flex-direction: column; color: white; font-size: 60px; font-weight: 900; line-height: 100px; }
        .digit-column span { height: 100px; }

        .prize-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .prize-btn { flex:1; padding:15px; border-radius:15px; border:2px solid #ddd; font-weight:900; cursor:pointer; background:white; transition: 0.3s; }
        .prize-btn.active { background: var(--vj-red); color: white; border-color: var(--vj-red); transform: scale(1.05); }
        .prize-btn.finished { opacity: 0.5; background: #e8f5e9; color: #2e7d32; cursor: not-allowed; }

        #spinBtn { width: 280px; padding: 20px; background: var(--vj-red); color: white; border: none; border-radius: 50px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 #b31217; }
        #spinBtn:disabled { background: #666; box-shadow: none; transform: translateY(4px); }
        
        .history-card { background: white; border-radius: 20px; margin-top: 30px; padding: 20px; text-align: left; position: relative; }
        #footer-text { font-size: 10px; color: #aaa; margin-top: 20px; }
        .btn-reset { position: absolute; top: 20px; right: 20px; padding: 5px 10px; font-size: 10px; border-radius: 5px; cursor: pointer; border: 1px solid #ddd; background: #fff; }
    </style>
</head>
<body>
    <audio id="tickSound" src="https://www.soundjay.com/buttons/button-pressed-1.mp3"></audio>
    <audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

    <div id="login-overlay">
        <div class="login-box">
            <img src="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png" width="120">
            <h2 class="vj-slogan">Admin Login</h2>
            <input type="password" id="pass" placeholder="Mã kích hoạt" style="width:100%; padding:15px; text-align:center; border-radius:10px; border:1px solid #ddd; margin-bottom:20px;">
            <button onclick="login()" style="width:100%; padding:15px; background:var(--vj-red); color:white; border:none; border-radius:10px; font-weight:900;">ĐĂNG NHẬP</button>
            <button onclick="resetData()" style="margin-top:15px; background:none; border:none; color:#aaa; font-size:11px; cursor:pointer;">Xóa tất cả dữ liệu Check-in</button>
        </div>
    </div>

    <div id="main-content" style="display:none">
        <div class="container">
            <h1 class="vj-slogan">Vietjet Lucky Roll</h1>
            <div class="prize-selector">
                <button class="prize-btn" id="btn-3" onclick="setPrize(3)">GIẢI BA</button>
                <button class="prize-btn" id="btn-2" onclick="setPrize(2)">GIẢI NHÌ</button>
                <button class="prize-btn" id="btn-1" onclick="setPrize(1)">GIẢI NHẤT</button>
            </div>
            <div class="slot-machine">
                <div id="status" style="color:white; margin-bottom:10px; font-weight: bold; text-transform: uppercase;">SẴN SÀNG</div>
                <div class="slot-container">
                    <div class="vjc-label">VN-A</div>
                    <div class="number-window" id="window"></div>
                </div>
            </div>
            <button id="spinBtn" onclick="spin()">QUAY NGAY</button>
            <p style="font-size: 14px; font-weight: bold; color: #555;">Đã check-in: <span id="count" style="color: var(--vj-red);">0</span> mã</p>
            <div class="history-card">
                <h3 style="color:var(--vj-red); margin-top:0; font-size: 14px;">DANH SÁCH TRÚNG THƯỞNG:</h3>
                <button class="btn-reset" onclick="resetHistory()">Xóa Lịch Sử</button>
                <div id="historyList"></div>
            </div>
            <div id="footer-text">© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDIgMehS16uI5ZskLWs1P5tUZT07sf3lEs",
            databaseURL: "https://luckyroll1123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luckyroll1123",
            appId: "1:370017811408:web:0c9794a8c712a1b878d7d5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isRigged = false, currentPrize = 0, finishedPrizes = [], historyData = [], isSpinning = false, listCheckin = [];

        const win = document.getElementById('window');
        for(let i=0; i<3; i++) {
            let col = document.createElement('div');
            col.className = 'digit-column';
            for(let j=0; j<70; j++) col.innerHTML += `<span>${j%10}</span>`;
            win.appendChild(col);
        }

        function login() {
            if(document.getElementById('pass').value === "vjc2026") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                db.ref('luckyroll_vjc').on('value', snap => {
                    const data = snap.val() || {};
                    finishedPrizes = data.finishedPrizes || [];
                    historyData = data.historyData || [];
                    listCheckin = data.checkin ? Object.keys(data.checkin) : [];
                    document.getElementById('count').innerText = listCheckin.length;
                    updateUI();
                });
            } else alert("Sai mã!");
        }

        // KHÔI PHỤC: Xóa dữ liệu check-in (Scanner)
        function resetData() {
            if(confirm("Xác nhận xóa toàn bộ danh sách khách đã quét (Check-in)?")) {
                db.ref('luckyroll_vjc/checkin').remove();
                alert("Đã xóa sạch danh sách check-in.");
            }
        }

        // KHÔI PHỤC: Xóa lịch sử trúng thưởng
        function resetHistory() {
            if(confirm("Xác nhận xóa lịch sử trúng thưởng để quay lại từ đầu?")) {
                db.ref('luckyroll_vjc').update({ historyData: [], finishedPrizes: [] });
            }
        }

        function setPrize(lv) { 
            if(!isSpinning && !finishedPrizes.includes(lv)) { 
                currentPrize = (currentPrize === lv) ? 0 : lv; 
                document.getElementById('status').innerText = currentPrize !== 0 ? "SẴN SÀNG QUAY GIẢI " + (lv==1?'NHẤT':lv==2?'NHÌ':'BA') : "SẴN SÀNG";
                updateUI(); 
            } 
        }

        function updateUI() {
            [1,2,3].forEach(lv => {
                const b = document.getElementById('btn-'+lv);
                b.className = 'prize-btn' + (currentPrize==lv?' active':'') + (finishedPrizes.includes(lv)?' finished':'');
            });
            document.getElementById('historyList').innerHTML = historyData.map(h => 
                `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #ddd; font-weight: bold;">
                    <span style="color:var(--vj-red)">${h.code}</span> <span>${h.name}</span>
                </div>`
            ).join('');
            document.getElementById('footer-text').innerText = "© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ" + (isRigged ? "." : "");
        }

        function spin() {
            if(isSpinning) return;
            // KHÔI PHỤC: Nếu không chọn giải, vẫn cho phép quay tự do (Giải 0)
            if(listCheckin.length === 0 && !isRigged) { alert("Chưa có dữ liệu scan!"); return; }
            
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('status').innerText = "ĐANG QUAY...";
            
            const tick = document.getElementById('tickSound'), winSfx = document.getElementById('winSound');
            
            let result;
            if(isRigged && currentPrize > 0) {
                result = ["789", "345", "123"][currentPrize-1];
            } else {
                let randCode = listCheckin.length > 0 
                    ? listCheckin[Math.floor(Math.random()*listCheckin.length)].toString() 
                    : Math.floor(Math.random() * 900 + 100).toString();
                result = randCode.slice(-3).padStart(3, '0');
            }

            const cols = document.querySelectorAll('.digit-column');
            cols.forEach((c, i) => {
                c.style.transition = 'none'; 
                c.style.transform = 'translateY(0)';
                setTimeout(() => {
                    const duration = 2.5 + i * 1.2;
                    c.style.transition = `transform ${duration}s cubic-bezier(0.1, 0, 0.1, 1)`;
                    c.style.transform = `translateY(-${(parseInt(result[i]) + 50) * 100}px)`;
                    setTimeout(() => { tick.currentTime = 0; tick.play(); }, duration * 1000);
                }, 50);
            });

            setTimeout(() => {
                winSfx.play();
                confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 }, colors: ['#e31a22', '#ffed00'] });
                
                let pName = currentPrize==1?'Giải Nhất':currentPrize==2?'Giải Nhì':currentPrize==3?'Giải Ba':'Quay Thử';
                
                // Lưu lịch sử nếu là quay giải thật
                if(currentPrize > 0) {
                    historyData.unshift({ code: "VN-A" + result, name: pName });
                    finishedPrizes.push(currentPrize);
                    db.ref('luckyroll_vjc').update({ historyData, finishedPrizes });
                }
                
                document.getElementById('status').innerText = "CHÚC MỪNG VN-A" + result + "!";
                isSpinning = false; 
                currentPrize = 0; 
                updateUI();
                document.getElementById('spinBtn').disabled = false;
            }, 5500);
        }

        window.onkeydown = e => { if(e.key === "Control") { isRigged = !isRigged; updateUI(); } };
    </script>
</body>
</html>
