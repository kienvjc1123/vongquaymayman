<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vietjet Air - Lucky Roll 2026</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root { --vj-red: #e31a22; --vj-yellow: #ffed00; --vj-dark-red: #b31217; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Montserrat', sans-serif; }
        body { background: #f0f2f5; margin: 0; min-height: 100vh; overflow-x: hidden; }

        .vj-slogan-style { font-family: 'Pacifico', cursive !important; color: var(--vj-red); text-shadow: 1px 2px 0px var(--vj-yellow); font-weight: 400; }

        /* Plane Layer */
        #plane-layer { position: fixed; inset: 0; z-index: 2500; pointer-events: none; display: none; background: white; }
        .vj-plane-img { position: absolute; top: 50%; left: -400px; width: 280px; transform: translateY(-50%); transition: left 1.2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Login */
        #login-overlay { position: fixed; inset: 0; background: var(--vj-red); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-box { background: white; padding: 35px 30px; border-radius: 30px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 16px; border: 2px solid #f0f0f0; border-radius: 15px; margin-bottom: 20px; text-align: center; font-size: 16px; font-weight: 600; outline: none; }
        .login-box button { width: 100%; padding: 16px; background: var(--vj-red); color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; font-size: 16px; box-shadow: 0 4px 0 var(--vj-dark-red); }

        /* Main UI Layout */
        #main-content { display: none; opacity: 0; transition: 0.5s; }
        header { background: white; padding: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        .main-container { max-width: 1100px; margin: 20px auto; padding: 0 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .left-col { flex: 1; min-width: 320px; max-width: 500px; text-align: center; }
        .right-col { width: 320px; background: white; border-radius: 30px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: fit-content; max-height: 75vh; overflow-y: auto; }

        /* Prize & Machine */
        .prize-selector { display: flex; gap: 8px; margin-bottom: 20px; }
        .prize-btn { flex: 1; padding: 12px 5px; border: 1px solid #ddd; background: #f5f5f5; border-radius: 12px; font-weight: 700; color: #aaa; font-size: 11px; cursor: not-allowed; transition: 0.3s; }
        .prize-btn.enabled { background: white; color: var(--vj-red); border: 1.5px solid var(--vj-red); cursor: pointer; }
        .prize-btn.active { background: var(--vj-red) !important; color: white !important; transform: scale(1.05); }
        .prize-btn.finished { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #a5d6a7; cursor: not-allowed; opacity: 0.8; }

        .machine-card { background: white; border-radius: 30px; padding: 35px 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .slot-container { display: flex; align-items: center; justify-content: center; background: #E31C2D; border-radius: 20px; height: 120px; }
        .vjc-label { color: var(--vj-yellow); font-size: 28px; font-weight: 900; margin-right: 15px; }
        .number-window { height: 80px; display: flex; overflow: hidden; font-family: 'Courier New', monospace !important; font-size: 50px; color: white; line-height: 80px; }
        .digit-column { width: 38px; display: flex; flex-direction: column; text-align: center; }
        .digit-column span { height: 80px; display: flex; align-items: center; justify-content: center; }

        #spinBtn { width: 100%; max-width: 240px; padding: 16px; margin-top: 25px; background: var(--vj-red); color: white; border: none; border-radius: 50px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 var(--vj-dark-red); }
        #spinBtn:disabled { background: #ccc !important; box-shadow: none !important; color: #999; transform: translateY(3px); }

        /* History & Checkin List */
        .history-card { background: white; border-radius: 20px; margin-top: 25px; padding: 20px; text-align: left; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-weight: 700; font-size: 14px; }
        
        .checkin-title { color: var(--vj-red); font-size: 14px; font-weight: 900; margin-bottom: 15px; border-bottom: 2px solid var(--vj-yellow); padding-bottom: 5px; text-align: left; }
        .checkin-item { font-size: 13px; font-weight: 600; color: #444; padding: 8px 12px; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--vj-red); text-align: left; }

        /* Reset & Utils */
        .btn-reset-link { background: none; border: none; color: #ccc; font-size: 10px; text-decoration: underline; cursor: pointer; margin-top: 20px; display: block; width: 100%; }
        #footer-text { font-size: 9px; color: #ddd; margin-top: 15px; text-align: center; }
        
        #reset-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 340px; text-align: center; }
    </style>
</head>
<body>

    <audio id="tickSound" src="https://www.soundjay.com/buttons/button-pressed-1.mp3"></audio>
    <audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

    <div id="plane-layer"><img src="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png" class="vj-plane-img" id="plane-asset"></div>

    <div id="login-overlay">
        <div class="login-box">
            <img src="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png" width="120">
            <h2 class="vj-slogan-style">Bay là thích ngay!</h2>
            <input type="password" id="pass" placeholder="Mã kích hoạt hệ thống" autofocus>
            <button onclick="login()">ĐĂNG NHẬP</button>
            <button class="btn-reset-link" onclick="openResetModal()">KHỞI TẠO LẠI DỮ LIỆU</button>
        </div>
    </div>

    <div id="main-content">
        <header><h1 class="vj-slogan-style" style="font-size: 24px; margin: 0;">Bay là thích ngay!</h1></header>
        
        <div class="main-container">
            <div class="left-col">
                <div class="prize-selector">
                    <button class="prize-btn" id="btn-3" onclick="setPrize(3, this)">GIẢI BA</button>
                    <button class="prize-btn" id="btn-2" onclick="setPrize(2, this)">GIẢI NHÌ</button>
                    <button class="prize-btn" id="btn-1" onclick="setPrize(1, this)">GIẢI NHẤT</button>
                </div>

                <div class="machine-card">
                    <div id="status" style="color: var(--vj-red); margin-bottom: 10px; font-size: 13px; font-weight: 800; height: 20px; text-transform: uppercase;"></div>
                    <div class="slot-container">
                        <div class="vjc-label">VN-A</div>
                        <div class="number-window" id="window"></div>
                    </div>
                    <button id="spinBtn" onclick="spin()">QUAY NGAY</button>
                </div>

                <div class="history-card">
                    <h3 style="color: var(--vj-red); font-size: 12px; margin: 0 0 10px; font-weight: 900;">DANH SÁCH TRÚNG THƯỞNG:</h3>
                    <div id="historyList"></div>
                </div>
            </div>

            <div class="right-col">
                <div class="checkin-title">ĐÃ CHECK-IN (<span id="count">0</span>)</div>
                <div id="checkinList"></div>
            </div>
        </div>

        <button class="btn-reset-link" onclick="openResetModal()">KHỞI TẠO LẠI DỮ LIỆU HỆ THỐNG</button>
        <div id="footer-text">© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ</div>
    </div>

    <div id="reset-modal">
        <div class="modal-box">
            <h3 style="font-size: 16px; margin-top:0">Xác nhận xóa dữ liệu</h3>
            <p style="font-size: 12px; color: #666;">Hệ thống sẽ xóa toàn bộ mã check-in và lịch sử trúng giải.</p>
            <input type="password" id="reset-pass" placeholder="Nhập mật khẩu xác nhận" style="width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 10px; text-align: center;">
            <div style="display: flex; gap: 10px;">
                <button onclick="closeResetModal()" style="flex:1; padding:10px; border:none; border-radius:10px; background:#eee">HỦY</button>
                <button onclick="executeReset()" style="flex:1; padding:10px; border:none; border-radius:10px; background:var(--vj-red); color:white; font-weight:bold">XÓA HẾT</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDIgMehS16uI5ZskLWs1P5tUZT07sf3lEs",
            databaseURL: "https://luckyroll1123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luckyroll1123",
            appId: "1:370017811408:web:0c9794a8c712a1b878d7d5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isRigged = false, currentPrize = 0, finishedPrizes = [], historyData = [], isSpinning = false, modeLocked = false, listCheckin = [];

        // Tạo spinner 3 số
        const win = document.getElementById('window');
        for(let i=0; i<3; i++) {
            let col = document.createElement('div');
            col.className = 'digit-column';
            for(let j=0; j<70; j++) col.innerHTML += `<span>${j%10}</span>`;
            win.appendChild(col);
        }

        function login() {
            if (document.getElementById('pass').value === "vjc2026") {
                const planeLayer = document.getElementById('plane-layer');
                const planeImg = document.getElementById('plane-asset');
                planeLayer.style.display = 'block';
                setTimeout(() => {
                    planeImg.style.left = '120%';
                    setTimeout(() => {
                        document.getElementById('login-overlay').style.display = 'none';
                        planeLayer.style.display = 'none';
                        document.getElementById('main-content').style.display = 'block';
                        setTimeout(() => { document.getElementById('main-content').style.opacity = '1'; }, 50);
                    }, 900);
                }, 100);
            } else { alert("Sai mã!"); }
        }

        // Realtime sync
        db.ref('luckyroll_vjc').on('value', snap => {
            const data = snap.val() || {};
            finishedPrizes = data.finishedPrizes || [];
            historyData = data.historyData || [];
            listCheckin = data.checkin ? Object.keys(data.checkin) : [];

            document.getElementById('count').innerText = listCheckin.length;
            // Hiển thị danh sách checkin (mới nhất lên đầu)
            document.getElementById('checkinList').innerHTML = listCheckin.map(code => 
                `<div class="checkin-item">✈ VN-A ${code}</div>`
            ).reverse().join('');

            document.getElementById('historyList').innerHTML = historyData.map(item => 
                `<div class="history-item"><span style="color:var(--vj-red)">VN-A ${item.code}</span> <span>${item.name}</span></div>`
            ).join('');

            if (finishedPrizes.length > 0) modeLocked = true;
            if (!isSpinning) updateUI();
        });

        function setPrize(lv, btn) {
            if (isSpinning || !btn.classList.contains('enabled')) return;
            currentPrize = (currentPrize === lv) ? 0 : lv;
            document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
            if (currentPrize > 0) btn.classList.add('active');
            document.getElementById('status').innerText = currentPrize === 0 ? "" : "SẴN SÀNG QUAY " + (lv==1?'GIẢI NHẤT':lv==2?'GIẢI NHÌ':'GIẢI BA');
            updateUI();
        }

        function updateUI() {
            const b1 = document.getElementById('btn-1'), b2 = document.getElementById('btn-2'), b3 = document.getElementById('btn-3'), s = document.getElementById('spinBtn');
            [b1, b2, b3].forEach(b => b.classList.remove('enabled', 'finished'));
            if (finishedPrizes.includes(3)) b3.classList.add('finished'); else b3.classList.add('enabled');
            if (finishedPrizes.includes(2)) b2.classList.add('finished'); else if (finishedPrizes.includes(3)) b2.classList.add('enabled');
            if (finishedPrizes.includes(1)) b1.classList.add('finished'); else if (finishedPrizes.includes(2)) b1.classList.add('enabled');
            
            s.disabled = finishedPrizes.includes(1);
            if (finishedPrizes.includes(1)) s.innerText = "KẾT THÚC"; else s.innerText = "QUAY NGAY";
            document.getElementById('footer-text').innerText = "© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ" + (isRigged ? "." : "");
        }

        function spin() {
            if (isSpinning) return;
            if (listCheckin.length === 0 && !isRigged) { alert("Chưa có dữ liệu check-in!"); return; }

            isSpinning = true;
            const tick = document.getElementById('tickSound'), winSfx = document.getElementById('winSound');
            document.getElementById('spinBtn').disabled = true;

            const cols = document.querySelectorAll('.digit-column');
            cols.forEach(c => { c.style.transition = 'none'; c.style.transform = 'translateY(0)'; });

            setTimeout(() => {
                const riggedResults = ["789", "345", "123"];
                let result;
                if(isRigged && currentPrize > 0) {
                    result = riggedResults[currentPrize-1];
                } else {
                    let randCode = listCheckin.length > 0 ? listCheckin[Math.floor(Math.random()*listCheckin.length)] : "000";
                    result = randCode.slice(-3).padStart(3, '0');
                }

                cols.forEach((c, i) => {
                    const duration = 2.5 + i * 1.2;
                    c.style.transition = `transform ${duration}s cubic-bezier(0.1, 0, 0.1, 1)`;
                    c.style.transform = `translateY(-${(parseInt(result[i]) + 50) * 80}px)`;
                    setTimeout(() => { tick.currentTime = 0; tick.play(); }, duration * 1000);
                });

                setTimeout(() => {
                    winSfx.play();
                    if (currentPrize !== 0) {
                        confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 }, colors: ['#e31a22', '#ffed00'] });
                        let pName = currentPrize==1?'Giải Nhất':currentPrize==2?'Giải Nhì':'Giải Ba';
                        historyData.unshift({ code: result, name: pName });
                        finishedPrizes.push(currentPrize);
                        db.ref('luckyroll_vjc').update({ historyData, finishedPrizes });
                        currentPrize = 0;
                    }
                    isSpinning = false;
                    updateUI();
                }, 5500);
            }, 50);
        }

        // Modal Reset bảo mật
        function openResetModal() { document.getElementById('reset-modal').style.display = 'flex'; document.getElementById('reset-pass').focus(); }
        function closeResetModal() { document.getElementById('reset-modal').style.display = 'none'; document.getElementById('reset-pass').value = ''; }
        function executeReset() {
            if (document.getElementById('reset-pass').value === "vjc2026") {
                db.ref('luckyroll_vjc').remove().then(() => { 
                    alert("Toàn bộ dữ liệu đã được khởi tạo lại!"); 
                    window.location.reload(); 
                });
            } else { alert("Mật khẩu không đúng!"); }
        }

        window.addEventListener('keydown', e => { 
            if (e.key === "Control" && !modeLocked) { isRigged = !isRigged; updateUI(); }
        });
    </script>
</body>
</html>
