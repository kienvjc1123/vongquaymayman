<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vietjet Air - Bay là thích ngay!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Pacifico&display=swap');

        :root { --vj-red: #e31a22; --vj-yellow: #ffed00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #f0f2f5; 
            margin: 0; 
            font-family: 'Montserrat', sans-serif;
            background-image: radial-gradient(circle at 20% 30%, #fff 0%, #f0f2f5 100%);
            min-height: 100vh;
        }

        /* Bảo mật */
        #login-overlay {
            position: fixed; inset: 0; background: var(--vj-red);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .login-box {
            background: white; padding: 40px 30px; border-radius: 24px;
            width: 90%; max-width: 350px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .login-box h2 { font-family: 'Pacifico', cursive; color: var(--vj-red); margin: 0 0 20px; font-size: 28px; }
        .login-box input {
            width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px;
            font-size: 16px; margin-bottom: 20px; outline: none; transition: 0.3s;
        }
        .login-box input:focus { border-color: var(--vj-red); }
        .login-box button {
            width: 100%; padding: 15px; background: var(--vj-red); color: white;
            border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        #main-content { display: none; }

        /* Header chuyên nghiệp */
        header { 
            background: white; padding: 20px; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .slogan { 
            font-family: 'Pacifico', cursive; 
            color: var(--vj-red); 
            font-size: 32px;
            text-shadow: 2px 2px 0px rgba(255, 237, 0, 0.8);
            margin: 0;
        }

        .container { max-width: 500px; margin: auto; padding: 20px; }

        /* Nút giải thưởng hiện đại */
        .prize-selector { display: flex; gap: 10px; margin: 20px 0; }
        .prize-btn {
            flex: 1; padding: 12px 5px; border: none; background: white;
            border-radius: 12px; font-weight: 900; color: #666;
            box-shadow: 0 4px 0 #ddd; cursor: pointer; transition: 0.2s;
            font-size: 12px; border: 1px solid #eee;
        }
        .prize-btn.active { 
            background: var(--vj-red); color: white; 
            box-shadow: 0 4px 0 #b31217; transform: translateY(-2px);
        }

        /* Hiệu ứng Quay số cuộn */
        .machine-card {
            background: white; border-radius: 30px; padding: 40px 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            position: relative; border: 1px solid rgba(255,255,255,0.8);
        }
        .slot-container {
            display: flex; align-items: center; justify-content: center;
            background: #1a1a1a; padding: 25px 15px; border-radius: 20px;
            box-shadow: inset 0 0 30px #000; overflow: hidden;
        }
        .vjc-text { color: var(--vj-yellow); font-size: 40px; font-weight: 900; margin-right: 15px; }
        
        /* Cấu trúc cuộn số */
        .number-window {
            height: 70px; display: flex; overflow: hidden;
            font-family: 'monospace'; font-size: 60px; color: white;
        }
        .digit-column {
            width: 45px; display: flex; flex-direction: column;
            transition: transform 2s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        .digit-column span { height: 70px; display: flex; align-items: center; justify-content: center; }

        #spinBtn {
            width: 100%; max-width: 280px; padding: 20px; margin-top: 30px;
            background: linear-gradient(to bottom, #ff4d4d, var(--vj-red));
            color: white; border: none; border-radius: 50px;
            font-size: 20px; font-weight: 900; cursor: pointer;
            box-shadow: 0 8px 0 #b31217, 0 15px 30px rgba(227,26,34,0.3);
            transition: 0.1s;
        }
        #spinBtn:active { transform: translateY(4px); box-shadow: 0 4px 0 #b31217; }
        #spinBtn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>Bay là thích ngay!</h2>
            <input type="password" id="pass" placeholder="Mật khẩu hệ thống..." autofocus>
            <button onclick="login()">ĐĂNG NHẬP</button>
        </div>
    </div>

    <div id="main-content">
        <header>
            <h1 class="slogan">Bay là thích ngay!</h1>
        </header>

        <div class="container">
            <div class="prize-selector">
                <button class="prize-btn" onclick="setPrize(3, this)">GIẢI BA</button>
                <button class="prize-btn" onclick="setPrize(2, this)">GIẢI NHÌ</button>
                <button class="prize-btn" onclick="setPrize(1, this)">GIẢI NHẤT</button>
            </div>

            <div class="machine-card">
                <div id="status" style="color: #888; margin-bottom: 15px; font-size: 14px; font-weight: bold;">SẴN SÀNG QUAY SỐ</div>
                <div class="slot-container">
                    <div class="vjc-text">VJC</div>
                    <div class="number-window" id="window">
                        <div class="digit-column" id="col1"></div>
                        <div class="digit-column" id="col2"></div>
                        <div class="digit-column" id="col3"></div>
                        <div class="digit-column" id="col4"></div>
                        <div class="digit-column" id="col5"></div>
                    </div>
                </div>
                <button id="spinBtn" disabled onclick="spin()">QUAY NGAY</button>
            </div>
            <p style="margin-top: 30px; font-size: 12px; color: #aaa;">© 2026 VIETJET AIR - PHIÊN BẢN NỘI BỘ</p>
        </div>
    </div>

    <script>
        // Khởi tạo dãy số trong các cột
        const columns = document.querySelectorAll('.digit-column');
        columns.forEach(col => {
            let content = '';
            for(let i=0; i<30; i++) content += `<span>${i % 10}</span>`;
            col.innerHTML = content;
        });

        function login() {
            if (document.getElementById('pass').value === "vjc2026") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

        let currentPrize = 0;
        function setPrize(lv, btn) {
            currentPrize = lv;
            document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('status').innerText = "ĐANG QUAY GIẢI " + (lv==1?'NHẤT':lv==2?'NHÌ':'BA');
        }

        function spin() {
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            
            // Lấy kết quả
            let result = "";
            const isCheat = !window.event.ctrlKey; // Không nhấn Ctrl là dàn xếp

            if (isCheat) {
                if (currentPrize === 1) result = "06370";
                else if (currentPrize === 2) result = "12370";
                else if (currentPrize === 3) result = "17939";
            } else {
                result = Math.floor(Math.random() * 90000 + 10000).toString();
            }

            // Hiệu ứng cuộn
            columns.forEach((col, idx) => {
                const targetDigit = parseInt(result[idx]);
                // Cuộn đến vị trí số (vòng thứ 2 để mượt)
                const move = (targetDigit + 10) * 70;
                col.style.transition = `transform ${2 + idx*0.5}s cubic-bezier(0.1, 0, 0.1, 1)`;
                col.style.transform = `translateY(-${move}px)`;
            });

            setTimeout(() => {
                confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 }, colors: ['#e31a22', '#ffed00'] });
                btn.disabled = false;
                // Reset vị trí nhẹ để có thể quay tiếp
                setTimeout(() => {
                    columns.forEach(col => { col.style.transition = 'none'; col.style.transform = 'translateY(0)'; });
                }, 4000);
            }, 4500);
        }
    </script>
</body>
</html>
