<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VJC - Scanner Checkin</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .box { width: 90%; max-width: 400px; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; border: 3px solid #e31a22; margin: 20px 0; }
        #status { font-weight: bold; padding: 10px; border-radius: 10px; transition: 0.3s; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        
        /* Màu cho các trạng thái */
        .success { background: #e8f5e9; color: #2e7d32; }
        .warning { background: #fff3e0; color: #ef6c00; }
        .error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <div class="box">
        <img src="https://raw.githubusercontent.com/kienvjc1123/vjc-asset/main/airplane.png" width="80">
        <h2 style="color:#e31a22; margin:10px 0">VJC CHECK-IN</h2>
        <div id="reader"></div>
        <div id="status">Sẵn sàng quét mã...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDIgMehS16uI5ZskLWs1P5tUZT07sf3lEs",
            databaseURL: "https://luckyroll1123-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luckyroll1123",
            appId: "1:370017811408:web:0c9794a8c712a1b878d7d5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isProcessing = false; // Tránh việc quét liên tục 1 mã trong khi đang xử lý

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
            if (isProcessing) return;
            isProcessing = true;

            const st = document.getElementById('status');
            const checkinRef = db.ref('luckyroll_vjc/checkin/' + text);

            // Kiểm tra mã đã tồn tại chưa
            checkinRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    // Nếu đã tồn tại
                    st.innerText = "MÁY BAY " + text + " ĐÃ CHECK-IN";
                    st.className = "warning";
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Rung cảnh báo
                    
                    setTimeout(() => {
                        resetStatus();
                    }, 3000);
                } else {
                    // Nếu chưa tồn tại -> Tiến hành ghi mới
                    checkinRef.set({ t: Date.now() }).then(() => {
                        st.innerText = "GHI NHẬN THÀNH CÔNG: " + text;
                        st.className = "success";
                        if (navigator.vibrate) navigator.vibrate(150); // Rung thành công
                        
                        setTimeout(() => {
                            resetStatus();
                        }, 2000);
                    });
                }
            }).catch((error) => {
                st.innerText = "LỖI KẾT NỐI!";
                st.className = "error";
                isProcessing = false;
            });
        });

        function resetStatus() {
            const st = document.getElementById('status');
            st.innerText = "Sẵn sàng quét mã...";
            st.className = "";
            isProcessing = false;
        }
    </script>
</body>
</html>
